<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no"
    />
    <meta
      name="description"
      content="Draw and edit polygons and polylines interactively."
    />
    <meta name="cesium-sandcastle-labels" content="Showcases" />
    <title>Cesium Demo</title>
    <script type="text/javascript" src="../Sandcastle-header.js"></script>
    <script
      type="text/javascript"
      src="../../../Build/CesiumUnminified/Cesium.js"
      nomodule
    ></script>
    <script type="module" src="../load-cesium-es6.js"></script>
  </head>
  <body class="sandcastle-loading" data-sandcastle-bucket="bucket-requirejs.html">
    <style>
      @import url(../templates/bucket.css);
      #toolbar {
        padding: 5px;
      }
      #toolbar button {
        margin: 2px 4px;
        padding: 4px 12px;
        cursor: pointer;
      }
      #toolbar button.active {
        background: #4caf50;
        color: white;
      }
      #status {
        margin-top: 8px;
        padding: 4px;
        font-size: 13px;
        color: #ccc;
      }
    </style>
    <div id="cesiumContainer" class="fullSize"></div>
    <div id="loadingOverlay"><h1>Loading...</h1></div>
    <div id="toolbar">
      <button id="btnDrawPolygon" type="button">Draw Polygon</button>
      <button id="btnDrawPolyline" type="button">Draw Polyline</button>
      <button id="btnPlacePoints" type="button">Place Points</button>
      <button id="btnTranslate" type="button">Translate</button>
      <button id="btnUndo" type="button">Undo</button>
      <button id="btnRedo" type="button">Redo</button>
      <button id="btnCancel" type="button">Cancel / Finish Edit</button>
      <button id="btnClear" type="button">Clear All</button>
      <div id="status">
        Click a button to start drawing. Click an existing shape to edit it.
      </div>
    </div>
    <script id="cesium_sandcastle_script">
      window.startup = async function (Cesium) {
        "use strict";
        //Sandcastle_Begin
        const viewer = new Cesium.Viewer("cesiumContainer", {
          selectionIndicator: false,
          infoBox: false,
          terrain: Cesium.Terrain.fromWorldTerrain(),
        });

        // Disable default double-click behavior
        viewer.cesiumWidget.screenSpaceEventHandler.removeInputAction(
          Cesium.ScreenSpaceEventType.LEFT_DOUBLE_CLICK,
        );

        // Create the shape editor
        const editor = new Cesium.ShapeEditor({
          viewer: viewer,
          clampToGround: true,
        });
        window._viewer = viewer;
        window._editor = editor;

        const statusEl = document.getElementById("status");
        const btnDrawPolygon = document.getElementById("btnDrawPolygon");
        const btnDrawPolyline = document.getElementById("btnDrawPolyline");
        const btnPlacePoints = document.getElementById("btnPlacePoints");
        const btnTranslate = document.getElementById("btnTranslate");
        const btnUndo = document.getElementById("btnUndo");
        const btnRedo = document.getElementById("btnRedo");
        const btnCancel = document.getElementById("btnCancel");
        const btnClear = document.getElementById("btnClear");

        function clearActive() {
          btnDrawPolygon.classList.remove("active");
          btnDrawPolyline.classList.remove("active");
          btnPlacePoints.classList.remove("active");
          btnTranslate.classList.remove("active");
        }

        // Mode change listener
        editor.modeChanged.addEventListener(function (newMode) {
          clearActive();
          switch (newMode) {
            case Cesium.ShapeEditorMode.DRAWING:
              statusEl.textContent =
                "Left-click to place vertices. Right-click or double-click to finish.";
              break;
            case Cesium.ShapeEditorMode.EDITING:
              statusEl.textContent =
                "Drag vertices to move them. Click gray midpoints to add vertices. " +
                "Delete key removes last vertex. Escape to finish.";
              break;
            case Cesium.ShapeEditorMode.PLACING_POINTS:
              statusEl.textContent = "Click to place points. Press Cancel to stop.";
              break;
            case Cesium.ShapeEditorMode.TRANSLATING:
              statusEl.textContent =
                "Click a shape to select it. Drag an axis arrow (Red=East, Green=North, Blue=Up) to move it.";
              break;
            default:
              statusEl.textContent =
                "Click a button to start. Click an existing shape to edit it. Ctrl+Z/Ctrl+Y to undo/redo.";
              break;
          }
        });

        // Draw complete listener
        editor.drawComplete.addEventListener(function (entity, positions) {
          statusEl.textContent = `Shape created with ${positions.length} vertices. Click it to edit, or draw a new shape.`;
        });

        // Edit complete listener
        editor.editComplete.addEventListener(function (entity, positions) {
          statusEl.textContent = `Edit complete (${positions.length} vertices). Click a shape to edit or draw a new one.`;
        });

        // Button handlers
        btnDrawPolygon.addEventListener("click", function () {
          clearActive();
          btnDrawPolygon.classList.add("active");
          editor.startDrawing("polygon");
        });

        btnDrawPolyline.addEventListener("click", function () {
          clearActive();
          btnDrawPolyline.classList.add("active");
          editor.startDrawing("polyline");
        });

        btnPlacePoints.addEventListener("click", function () {
          clearActive();
          btnPlacePoints.classList.add("active");
          editor.startPlacingPoints();
        });

        btnTranslate.addEventListener("click", function () {
          clearActive();
          btnTranslate.classList.add("active");
          editor.startTranslating();
        });

        btnUndo.addEventListener("click", function () {
          editor.undo();
        });

        btnRedo.addEventListener("click", function () {
          editor.redo();
        });

        btnCancel.addEventListener("click", function () {
          editor.cancel();
        });

        btnClear.addEventListener("click", function () {
          editor.clearAll();
          statusEl.textContent = "All shapes cleared.";
        });

        // Fly to a nice area
        viewer.camera.lookAt(
          Cesium.Cartesian3.fromDegrees(-122.2058, 46.1955, 1000.0),
          new Cesium.Cartesian3(5000.0, 5000.0, 5000.0),
        );
        viewer.camera.lookAtTransform(Cesium.Matrix4.IDENTITY);
        //Sandcastle_End
      };
      if (typeof Cesium !== "undefined") {
        window.startupCalled = true;
        window.startup(Cesium).catch((error) => {
          "use strict";
          console.error(error);
        });
        Sandcastle.finishedLoading();
      }
    </script>
  </body>
</html>
